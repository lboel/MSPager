; MSPager group configuration
;
; Every pager built from this repo applies these values at EVERY boot, so all
; pagers meet on the same channel with the same radio settings. Changes made in
; the MeshCore app to the pager channel or radio are reset on the next reboot.
;
; The channel KEY is secret and lives in pager.secret.ini (gitignored), which
; overrides channel_key below. Copy pager.secret.ini.example to pager.secret.ini
; and put the group key in it. The build fails until you do.
; All pagers of a group must be built with the same key.

[pager]
; channel all pagers meet in (max 31 chars)
channel_name = Pager
; placeholder - the real key comes from pager.secret.ini
channel_key = SET_IN_pager.secret.ini

; radio: MeshCore "EU/UK (Narrow)" preset, 869.618 MHz / BW 62.5 kHz / SF 8 / CR 5
radio_freq = 869.618
radio_bw = 62.5
radio_sf = 8
radio_cr = 5
